# Deploys every push to Cloudflare Pages: main -> production, other branches -> <branch>.kalvio-build.pages.dev.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  580a7755e020979114ebfddba1d768eb
# and two repository variables: VITE_LEADFINDER_URL, VITE_LEADFINDER_KEY (publishable key only).
# Until the token secret exists, the deploy step is skipped and the workflow still passes.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: ['**']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_LEADFINDER_URL: ${{ vars.VITE_LEADFINDER_URL }}
          VITE_LEADFINDER_KEY: ${{ vars.VITE_LEADFINDER_KEY }}
          SITE_ORIGIN: https://kalvio-build.pages.dev
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        run: npx wrangler pages deploy dist --project-name kalvio-build --branch "${GITHUB_REF_NAME}" --commit-hash "${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
